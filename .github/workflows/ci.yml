name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: ./scripts/setup.sh

      - name: Build & test
        run: xcodebuild -project Dial.xcodeproj -scheme Dial -destination 'platform=macOS' test
