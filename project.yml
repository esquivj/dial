name: Dial
options:
  bundleIdPrefix: com.dial
  deploymentTarget:
    macOS: "14.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    # Stable self-signed code-signing cert "Dial Local Dev" (created via
    # /usr/bin/openssl + security import). Same identity hash on every
    # build, so macOS TCC treats consecutive rebuilds as the same app
    # and the Screen Recording grant persists. Cert valid for 10 years.
    #
    # The cert is "not trusted" by Gatekeeper (because self-signed) but
    # codesign accepts it for *signing*; trust only matters for verifying
    # signatures on someone else's machine, which is irrelevant for a
    # personal app that we're never distributing.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Dial Local Dev"
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.29.0"
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: "4.2.2"
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.17.0"

targets:
  Dial:
    type: application
    platform: macOS
    sources:
      - path: Dial
        excludes:
          - "Resources/Fonts/**"
          - "Resources/Pets/**"
      # Resources are added back via the explicit `sources` entries below
      # with `buildPhase: resources`. The earlier `resources:` key was a
      # no-op with this xcodegen version — files were registered in the
      # navigator but never added to the target's Resources build phase,
      # so the app shipped without fonts or pet sprites.
      - path: Dial/Resources/Fonts
        buildPhase: resources
      - path: Dial/Resources/Pets
        buildPhase: resources
    info:
      path: Dial/App/Info.plist
      properties:
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        ATSApplicationFontsPath: Fonts/
        SpotifyClientID: YOUR_SPOTIFY_CLIENT_ID
        # Shown in the macOS permission prompt when the spectrum visualizer
        # first tries to start ScreenCaptureKit. ScreenCaptureKit's audio
        # capture is gated by Screen Recording TCC even when no video frames
        # are consumed.
        NSScreenCaptureUsageDescription: "Dial captures system audio to render a real-time spectrum visualizer for music playback. Audio never leaves your machine."
        CFBundleURLTypes:
          - CFBundleURLName: com.dial.callback
            CFBundleURLSchemes: [dial]
    entitlements:
      path: Dial/App/Dial.entitlements
      properties:
        # Personal menubar app, not App Store bound — sandbox off to keep
        # snapshot tests writable, ASWebAuthenticationSession simple, and
        # the Spotify Extended Streaming History import flow able to read
        # whatever folder the user picks. Hardened runtime stays on.
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        # Allow loading Xcode's debug-build helper dylib (Dial.debug.dylib)
        # under hardened runtime. Without this entitlement, library
        # validation rejects the dylib when the main app is signed with our
        # self-signed cert because the team IDs nominally don't match,
        # breaking `xcodebuild test`. Dial doesn't load any third-party
        # plugins, so loosening library validation isn't a real risk.
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dial.Dial
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Juan Esquivel"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: GRDB
        product: GRDB
      - package: KeychainAccess
        product: KeychainAccess

  DialTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - DialTests
    resources:
      - path: DialTests/Fixtures
        type: folder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Dial.app/Contents/MacOS/Dial"
        PRODUCT_BUNDLE_IDENTIFIER: com.dial.DialTests
        # Tests must sign with the same identity as the main app — otherwise
        # the dynamic loader rejects Dial.debug.dylib at test launch with
        # "mapping process and mapped file (non-platform) have different
        # Team IDs". Globally we use Manual + Dial Local Dev; tests inherit
        # those, but call them out explicitly here so the relationship is
        # obvious to the next reader.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Dial Local Dev"
    dependencies:
      - target: Dial
      - package: SnapshotTesting
        product: SnapshotTesting

schemes:
  Dial:
    build:
      targets:
        Dial: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - DialTests
